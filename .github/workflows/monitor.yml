name: Weekly model monitoring

# Retrains on the public data, scores the simulated batches, and commits the refreshed
# output/monitoring_report.json so downstream alerts (see docs/power-automate-alert.md) read current results.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - run: python monitor.py
      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/monitoring_report.json output/results.md
          git diff --cached --quiet || git commit -m "Refresh monitoring report"
          git push
